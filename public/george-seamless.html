<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPX George Preview</title>
<link rel="preload" as="image" href="/images/fpx-hero-timber-yard.webp" fetchpriority="high">
<link rel="preload" as="image" href="/images/LaptopPhone2.webp">
<style>html,body{margin:0;min-height:100%;background:#fff;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#24483b;font-weight:700}</style>
</head>
<body>
<div class="loading">Loading FPX preview…</div>
<script>
(async()=>{
  const response=await fetch('/george-mockup.html?v=20261022-final-pass',{cache:'no-store'});
  let html=await response.text();

  html=html.replace('Current stock examples','Available through FPX Stock');
  html=html.replaceAll('https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/Laptop-phone.png','/images/LaptopPhone2.webp');
  html=html.replaceAll('https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/fpx-hero-timber-yard.webp','/images/fpx-hero-timber-yard.webp');
  html=html.replaceAll('https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/fpx-logo-horizontal-original.png','/images/fpx-logo-horizontal-original.png');

  // George review: use the new high-resolution FPX screenshots.
  html=html.replaceAll('https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/fpx-browse-stock-homepage.png','https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/BrowseStock.png');
  html=html.replaceAll('https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/fpx-submit-request-homepage.png','https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/RequestList.png');

  // George review: do not narrow the supply message with an artificial product ceiling.
  html=html.replace('<b>Wide product range</b><span>Sawn, structural, treated and specialised timber.</span>','<b>Treated and Untreated timber</b><span>Tell us what you need.</span>');

  // George review: keep only the four confirmed parent categories and use the supplied imagery.
  const rangeSection=`<section id="range" class="section alt"><div class="wrap">
    <div class="range-head"><div><p class="ey">Timber Range</p><h2>Timber for the requirement at hand.</h2><p class="sub">Explore the four main FPX timber categories, then browse current stock or send us the requirement you need sourced.</p></div></div>
    <div class="category-grid">
      <article class="category-card">
        <a class="category-media category-carousel" href="/manufacturing" aria-label="Explore Manufacturing timber">
          <img class="is-active" src="https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/Manufacturing1.png" alt="Manufacturing timber">
          <img src="https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/Manufacturing2.png" alt="Manufacturing timber">
          <img src="https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/Manufacturing3.png" alt="Manufacturing timber">
          <img src="https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/Manufacturing4.png" alt="Manufacturing timber">
          <span class="category-count">01</span>
        </a>
        <div class="category-copy"><h3>Manufacturing</h3><a href="/manufacturing">Explore category →</a></div>
      </article>
      <article class="category-card">
        <a class="category-media category-carousel" href="/building-construction" aria-label="Explore Building and Construction timber">
          <img class="is-active" src="https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/Building%20%26%20Construction1.png" alt="Building and Construction timber">
          <img src="https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/Building%20%26%20Construction2.png" alt="Building and Construction timber">
          <img src="https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/Building%20%26%20Construction3.png" alt="Building and Construction timber">
          <img src="https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/Building%20%26%20Construction4.png" alt="Building and Construction timber">
          <span class="category-count">02</span>
        </a>
        <div class="category-copy"><h3>Building and Construction</h3><a href="/building-construction">Explore category →</a></div>
      </article>
      <article class="category-card">
        <a class="category-media category-carousel" href="/outdoor-landscaping" aria-label="Explore Outdoor and Landscaping timber">
          <img class="is-active" src="https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/Outdoor%20and%20landscaping1.png" alt="Outdoor and Landscaping timber">
          <img src="https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/Outdoor%20and%20landscaping2.png" alt="Outdoor and Landscaping timber">
          <img src="https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/Outdoor%20and%20landscaping3.png" alt="Outdoor and Landscaping timber">
          <img src="https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/Outdoor%20and%20landscaping4.png" alt="Outdoor and Landscaping timber">
          <span class="category-count">03</span>
        </a>
        <div class="category-copy"><h3>Outdoor and Landscaping</h3><a href="/outdoor-landscaping">Explore category →</a></div>
      </article>
      <article class="category-card">
        <a class="category-media" href="/dunnage" aria-label="Explore Dunnage timber">
          <img class="is-active" src="https://raw.githubusercontent.com/FPXTeam/fpx-website/main/public/images/Dunnage1.png" alt="Dunnage timber">
          <span class="category-count">04</span>
        </a>
        <div class="category-copy"><h3>Dunnage</h3><a href="/dunnage">Explore category →</a></div>
      </article>
    </div>
    <div class="request-panel"><p class="ey">Broader sourcing</p><h3>Need something outside current stock?</h3><p>FPX can source wider New Zealand pine requirements through Sutcliffe Trading's supplier relationships.</p><div class="capabilities">
      <div class="capability">Sawn timber</div><div class="capability">Structural &amp; treated timber</div><div class="capability">Mouldings &amp; remanufactured products</div><div class="capability">Plywood</div><div class="capability">Engineered timber</div><div class="capability">Roundwood</div>
    </div><p class="network-line">From New Zealand Radiata pine to a wide range of finished products.</p></div>
  </div></section>`;
  html=html.replace(/<section id="range"[\s\S]*?<\/section>/,rangeSection);

  html=html.replaceAll('<img ','<img loading="lazy" decoding="async" ');
  html=html.replace('loading="lazy" decoding="async" class="hero-bg"','loading="eager" decoding="async" fetchpriority="high" class="hero-bg"');
  html=html.replace('<div class="device"><img loading="lazy"','<div class="device"><img loading="eager"');
  html=html.replace('<a class="brand" href="/"><img loading="lazy"','<a class="brand" href="/"><img loading="eager"');

  // Keep George's approved homepage layout, but connect its site navigation
  // to the exact revised Next.js pages included in this preview branch.
  const previewRoutes=[
    ['href="/"','href="/george-seamless.html"'],
    ['href="#sourcing"','href="/fpx-sourcing"'],
    ['href="#range"','href="/timber"'],
    ['href="#customers"','href="/our-customers"'],
    ['href="#intel"','href="/fpx-intelligence"']
  ];
  previewRoutes.forEach(([from,to])=>{html=html.replaceAll(from,to)});

  // The original static homepage mockup had an older shortened desktop nav.
  // Replace it with the same complete top-level navigation used by the inner pages.
  const oldDesktopNav='<nav class="links"><a href="/fpx-sourcing">FPX Sourcing</a><a href="/timber">Timber Range</a><a href="/our-customers">Our Customers</a><a href="/fpx-intelligence">FPX Intelligence</a><a href="/about-us">About Us</a></nav>';
  const completeDesktopNav=`<nav class="links" aria-label="Primary navigation">
    <a href="/fpx-sourcing">FPX Sourcing</a>
    <a href="/timber">Timber Range</a>
    <a href="/our-customers">Our Customers</a>
    <a href="/fpx-intelligence">FPX Intelligence</a>
    <div class="home-resources">
      <button type="button" aria-haspopup="true">Resources <span aria-hidden="true">⌄</span></button>
      <div class="home-resources-menu">
        <a href="/industry-insights"><b>FPX Insights</b><small>Timber guides and product information.</small></a>
        <a href="/saw-point"><b>Saw Point</b><small>New Zealand timber industry updates.</small></a>
        <a href="/frequently-asked-questions"><b>FAQ</b><small>Answers about using FPX.</small></a>
      </div>
    </div>
    <a href="/about-us">About Us</a>
    <a href="/contact-us">Contact</a>
  </nav>`;
  html=html.replace(oldDesktopNav,completeDesktopNav);

  // Wire the homepage Saw Point form to the same API used by the Next.js footer/page forms.
  html=html.replace('<form class="footer-form" onsubmit="event.preventDefault()"><input placeholder="Name" aria-label="Name"><input type="email" placeholder="Email" aria-label="Email"><button type="submit">Subscribe</button></form>',
    '<form class="footer-form" data-sawpoint-subscribe><input class="fpx-honeypot" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><input type="hidden" name="source" value="FPX website footer"><input name="name" autocomplete="name" placeholder="Name" aria-label="Name" required><input name="email" type="email" autocomplete="email" placeholder="Email" aria-label="Email" required><button type="submit">Subscribe</button><small class="footer-form-status" aria-live="polite">Unsubscribe any time.</small></form>');

  const headAdditions=`
    <link rel="stylesheet" href="/george-polish.css?v=20261026-refined-motion">
    <link rel="stylesheet" href="/george-mobile-pass.css?v=20261022-mobile1">
    <link rel="stylesheet" href="/george-mobile-nav.css?v=20261022-final2">
    <link rel="stylesheet" href="/george-mobile-experience.css?v=20261026">
    <style>
      .links{align-items:center}
      .home-resources{position:relative;display:flex;align-items:center}
      .home-resources>button{display:flex;align-items:center;gap:7px;border:0;background:transparent;padding:0;color:inherit;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
      .home-resources>button span{font-size:18px;line-height:1;transform:translateY(-1px)}
      .home-resources-menu{position:absolute;top:calc(100% + 18px);left:50%;transform:translateX(-50%) translateY(7px);width:245px;padding:8px;background:#fff;border:1px solid #DCE5E0;border-radius:12px;box-shadow:0 18px 44px rgba(4,14,14,.14);opacity:0;visibility:hidden;pointer-events:none;transition:.18s ease;z-index:100}
      .home-resources:hover .home-resources-menu,.home-resources:focus-within .home-resources-menu{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0)}
      .home-resources-menu a{display:block;padding:10px 11px;border-radius:8px}
      .home-resources-menu a:hover{background:#F4F7F5;color:#040E0E}
      .home-resources-menu a:after{display:none}
      .home-resources-menu b{display:block;font-size:12px;color:#040E0E}
      .home-resources-menu small{display:block;margin-top:3px;color:#66736D;font-size:10px;line-height:1.35;font-weight:400}

      /* Source screenshots: fill the media area cleanly with no padded white card around them. */
      .source-visual{padding:0!important;background:#e9eeeb!important}
      .source-shot{height:360px!important;border-radius:0!important;box-shadow:none!important;background:#e9eeeb!important}
      .source-shot img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:center top!important;background:transparent!important}

      /* Four confirmed parent categories. */
      .category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
      .category-card{overflow:hidden;border:1px solid #DCE5E0;border-radius:16px;background:#fff;min-width:0}
      .category-media{position:relative;display:block;height:255px;overflow:hidden;background:#e8eeeb}
      .category-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.015);transition:opacity .55s ease,transform 4.8s ease}
      .category-media img.is-active{opacity:1;transform:scale(1.045)}
      .category-count{position:absolute;z-index:3;top:13px;left:13px;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);color:#2c725a;font:900 10px Lato,Arial,sans-serif}
      .category-copy{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 18px 18px}
      .category-copy h3{margin:0;font:900 19px/1.15 Lato,Arial,sans-serif}
      .category-copy a{flex:0 0 auto;color:#2c725a;font-size:11.5px;font-weight:800}
      .footer-form .fpx-honeypot{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important}
      .footer-form-status{grid-column:1/-1;color:#9FB0A8;font-size:10px;line-height:1.4;min-height:14px}
      .footer-form button:disabled{opacity:.65;cursor:wait}

      @media(max-width:1150px) and (min-width:901px){.links{gap:13px}.links a,.home-resources>button{font-size:11.5px}.nav{gap:20px}}
      @media(max-width:900px){.source-shot{height:310px!important}.category-media{height:230px}}
      @media(max-width:650px){.source-shot{height:245px!important}.category-grid{grid-template-columns:1fr}.category-media{height:220px}.category-copy{align-items:flex-start;flex-direction:column;gap:8px}}
    </style>
    <link rel="stylesheet" href="/george-header-sticky.css?v=20261026">`;
  const bodyAdditions=`<script src="/george-enhancements.js?v=20261026-refined-motion"><\/script>
  <script>
  (()=>{
    const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!reduceMotion){
      document.querySelectorAll('.category-carousel').forEach((carousel,cardIndex)=>{
        const images=[...carousel.querySelectorAll('img')];
        if(images.length<2)return;
        let active=0;
        window.setInterval(()=>{
          images[active].classList.remove('is-active');
          active=(active+1)%images.length;
          images[active].classList.add('is-active');
        },4200+(cardIndex*260));
      });
    }

    const form=document.querySelector('[data-sawpoint-subscribe]');
    if(form){
      const button=form.querySelector('button[type="submit"]');
      const status=form.querySelector('.footer-form-status');
      form.addEventListener('submit',async(event)=>{
        event.preventDefault();
        button.disabled=true;
        const oldLabel=button.textContent;
        button.textContent='Subscribing…';
        if(status)status.textContent='';
        try{
          const payload=Object.fromEntries(new FormData(form).entries());
          const response=await fetch('/api/saw-point-subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
          const data=await response.json().catch(()=>({}));
          if(!response.ok)throw new Error(data?.error||'Unable to subscribe right now.');
          form.reset();
          if(status)status.textContent="You're on the Saw Point list.";
          if(window.dataLayer)window.dataLayer.push({event:'saw_point_subscribe',event_source:'footer'});
        }catch(error){
          if(status)status.textContent=error instanceof Error?error.message:'Unable to subscribe right now.';
        }finally{
          button.disabled=false;
          button.textContent=oldLabel;
        }
      });
    }
  })();
  <\/script>`;

  html=html.replace('</head>',headAdditions+'</head>');
  html=html.replace('</body>',bodyAdditions+'</body>');

  document.open();
  document.write(html);
  document.close();
})().catch(()=>{document.body.innerHTML='<div class="loading">Unable to load preview.</div>'});
</script>
</body>
</html>
